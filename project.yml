name: CalmMind
options:
  bundleIdPrefix: com.calmmind
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  minimumXcodeGenVersion: "2.35.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  CalmMind:
    type: application
    platform: iOS
    sources:
      - path: CalmMind
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calmmind.app
        INFOPLIST_GENERATION_MODE: GeneratedFile
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: CalmMind/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDisplayName: CalmMind
    entitlements:
      path: CalmMind/CalmMind.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.calmmind.app
        com.apple.security.application-groups:
          - group.com.calmmind.app

  CalmMindTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CalmMindTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calmmind.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CalmMind

  CalmMindUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CalmMindUITests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calmmind.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CalmMind

schemes:
  CalmMind:
    build:
      targets:
        CalmMind: all
        CalmMindTests: [test]
        CalmMindUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - CalmMindTests
        - CalmMindUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
